name: Build full DQM3 database

on:
  workflow_dispatch:

  push:
    paths:
      - "scripts/update_monsters.py"
      - "scripts/update_skills.py"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4


      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install parser
        run: |
          pip install requests beautifulsoup4


      - name: Build monster data
        run: |
          python scripts/update_monsters.py


      - name: Build skill data
        run: |
          python scripts/update_skills.py


      - name: Validate databases
        run: |

          python - <<'PY'

          import json

          monsters = json.load(
              open(
                  "data.json",
                  encoding="utf-8"
              )
          )

          skills = json.load(
              open(
                  "skills.json",
                  encoding="utf-8"
              )
          )

          monster_count = len(
              monsters.get(
                  "monsters",
                  []
              )
          )

          skill_count = len(
              skills.get(
                  "skills",
                  []
              )
          )

          print(
              "monster count:",
              monster_count
          )

          print(
              "skill count:",
              skill_count
          )


          if monster_count < 500:

              raise SystemExit(
                  "Too few monsters"
              )


          if skill_count < 200:

              raise SystemExit(
                  "Too few skills"
              )

          PY


      - name: Commit generated databases
        run: |

          git config user.name \
            "dqm3-data-bot"

          git config user.email \
            "actions@users.noreply.github.com"

          git add \
            data.json \
            skills.json

          git diff \
            --cached \
            --quiet \
            && exit 0

          git commit \
            -m "モンスター・スキルデータを更新"

          git push
