<!doctype html>

<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#111827"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-title"
  content="DQM3配合"
>

<link
  rel="manifest"
  href="./manifest.webmanifest"
>

<link
  rel="apple-touch-icon"
  href="./icon-192.png"
>

<link
  rel="stylesheet"
  href="./style.css?v=19"
>

<title>
DQM3 配合検索
</title>

</head>


<body>


<header>

  <nav aria-label="ゲーム切り替え" style="margin:0 0 10px;font-size:14px;color:#d1d5db;">
    モンスターズ3 ／ <a href="./dqm4/" style="display:inline-block;padding:8px 10px;color:#c7d2fe;">モンスターズ4へ</a>
  </nav>

  <div class="headrow">

    <h1>
      DQM3 配合検索
    </h1>

    <span id="net"></span>

  </div>


  <div class="tabs">

    <button
      id="monsterTab"
      class="tab active"
      type="button"
    >
      モンスター
    </button>

    <button
      id="skillTab"
      class="tab"
      type="button"
    >
      スキル
    </button>

    <button
      id="planTab"
      class="tab"
      type="button"
    >
      配合計画
    </button>

    <button
      id="recommendTab"
      class="tab"
      type="button"
    >
      おすすめ編成
    </button>

  </div>


  <div id="normalSearch">

    <input
      id="q"
      type="search"
      placeholder="モンスター名を入力"
      autocomplete="off"
    >


    <div
      id="sortRow"
      class="sortrow"
    >

      <label for="sortSelect">
        並び順
      </label>

      <select id="sortSelect">

        <option value="number">
          図鑑番号順
        </option>

        <option value="name">
          名前順
        </option>

        <option value="rank">
          ランク順
        </option>

        <option value="family">
          種族順
        </option>

      </select>

    </div>

  </div>


  <div
    id="recommendControls"
    class="recommend-controls"
    hidden
  >
    <label>
      テーマ
      <select id="recommendTarget">
        <optgroup label="属性">
          <option value="fire">🔥 火</option>
          <option value="water">💧 水</option>
          <option value="wind">🌪️ 風</option>
          <option value="earth">🪨 地</option>
          <option value="explosion">💥 爆発</option>
          <option value="ice">❄️ 氷結</option>
          <option value="electric">⚡ 電撃</option>
          <option value="light">✨ 光</option>
          <option value="dark">🌑 闇</option>
        </optgroup>
        <optgroup label="状態異常・妨害">
          <option value="sleep">😴 眠り</option>
          <option value="confusion">🌀 混乱</option>
          <option value="paralysis">⚡ マヒ</option>
          <option value="stun">💫 休み</option>
          <option value="poison">☠️ 毒</option>
          <option value="blind">🌫️ 幻惑</option>
          <option value="seal">🔒 封じ</option>
          <option value="debuff">📉 弱体化</option>
          <option value="death">💀 即死</option>
        </optgroup>
      </select>
    </label>

    <label>
      方針
      <select id="recommendStrategy">
        <option value="stable">安定攻略</option>
        <option value="power">火力重視</option>
        <option value="control">妨害重視</option>
      </select>
    </label>
  </div>

  <div
    id="planControls"
    class="plan-controls"
    hidden
  >

    <input
      id="planTarget"
      type="search"
      list="monsterOptions"
      placeholder="作りたいモンスター名"
      autocomplete="off"
    >

    <datalist
      id="monsterOptions"
    ></datalist>

    <button
      id="buildPlan"
      class="mainbutton"
      type="button"
    >
      配合ルートを作成
    </button>

  </div>

</header>


<main>

  <div
    id="status"
    class="status"
  >
    データを読み込み中…
  </div>

  <div id="results"></div>

</main>


<footer>

  モンスター名をタップすると画像検索を開きます。<br>

  配合計画のチェック状態は
  この端末に保存されます。

</footer>


<script
  src="./app.js?v=19"
></script>

</body>

</html>
