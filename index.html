<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DQM3配合">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./style.css?v=8">

<title>DQM3 配合検索</title>
</head>

<body>

<header>

  <div class="headrow">
    <h1>DQM3 配合検索</h1>
    <span id="net"></span>
  </div>

  <div class="tabs">

    <button
      id="monsterTab"
      class="tab active"
      type="button"
    >
      モンスター
    </button>

    <button
      id="skillTab"
      class="tab"
      type="button"
    >
      スキル
    </button>

  </div>

  <input
    id="q"
    type="search"
    placeholder="モンスター名を入力"
    autocomplete="off"
  >

  <div
    id="sortRow"
    class="sortrow"
  >

    <label for="sortSelect">
      並び順
    </label>

    <select id="sortSelect">

      <option value="number">
        図鑑番号順
      </option>

      <option value="name">
        名前順
      </option>

      <option value="rank">
        ランク順
      </option>

      <option value="family">
        種族順
      </option>

    </select>

  </div>

</header>


<main>

  <div
    id="status"
    class="status"
  >
    データを読み込み中…
  </div>

  <div id="results"></div>

</main>


<footer>

  モンスター名をタップすると画像検索を開きます。<br>

  スキルでは
  進化条件・覚える特技・上位スキルを検索できます。

</footer>


<script src="./app.js?v=8"></script>

</body>
</html>
