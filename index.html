<!doctype html>

<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#111827"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-title"
  content="DQM3配合"
>

<link
  rel="manifest"
  href="./manifest.webmanifest"
>

<link
  rel="apple-touch-icon"
  href="./icon-192.png"
>

<link
  rel="stylesheet"
  href="./style.css?v=10"
>

<title>
DQM3 配合検索
</title>

</head>


<body>


<header>

  <div class="headrow">

    <h1>
      DQM3 配合検索
    </h1>

    <span id="net"></span>

  </div>


  <div class="tabs">

    <button
      id="monsterTab"
      class="tab active"
      type="button"
    >
      モンスター
    </button>

    <button
      id="skillTab"
      class="tab"
      type="button"
    >
      スキル
    </button>

    <button
      id="planTab"
      class="tab"
      type="button"
    >
      配合計画
    </button>

  </div>


  <div id="normalSearch">

    <input
      id="q"
      type="search"
      placeholder="モンスター名を入力"
      autocomplete="off"
    >


    <div
      id="sortRow"
      class="sortrow"
    >

      <label for="sortSelect">
        並び順
      </label>

      <select id="sortSelect">

        <option value="number">
          図鑑番号順
        </option>

        <option value="name">
          名前順
        </option>

        <option value="rank">
          ランク順
        </option>

        <option value="family">
          種族順
        </option>

      </select>

    </div>

  </div>


  <div
    id="planControls"
    class="plan-controls"
    hidden
  >

    <input
      id="planTarget"
      type="search"
      list="monsterOptions"
      placeholder="作りたいモンスター名"
      autocomplete="off"
    >

    <datalist
      id="monsterOptions"
    ></datalist>

    <button
      id="buildPlan"
      class="mainbutton"
      type="button"
    >
      配合ルートを作成
    </button>

  </div>

</header>


<main>

  <div
    id="status"
    class="status"
  >
    データを読み込み中…
  </div>

  <div id="results"></div>

</main>


<footer>

  モンスター名をタップすると画像検索を開きます。<br>

  配合計画のチェック状態は
  この端末に保存されます。

</footer>


<script
  src="./app.js?v=10"
></script>

</body>

</html>
