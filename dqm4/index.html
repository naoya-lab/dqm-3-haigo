<!doctype html>

<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#111827"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-title"
  content="DQM4配合"
>

<link
  rel="manifest"
  href="./manifest.webmanifest"
>

<link
  rel="apple-touch-icon"
  href="./icon-192.png"
>

<link
  rel="stylesheet"
  href="./style.css?v=3"
>

<title>
DQM4 配合検索
</title>

</head>


<body>


<header>

  <nav aria-label="ゲーム切り替え"><a href="../">モンスターズ3へ</a> ／ モンスターズ4</nav>

  <div class="headrow">

    <h1>
      DQM4 配合検索
    </h1>

    <span id="net"></span>

  </div>


  <div class="tabs">

    <button
      id="monsterTab"
      class="tab active"
      type="button"
    >
      モンスター
    </button>

    <button
      id="skillTab"
      class="tab"
      type="button"
    >
      スキル
    </button>

    <button
      id="planTab"
      class="tab"
      type="button"
    >
      配合計画
    </button>

    <button
      id="recommendTab"
      class="tab"
      type="button"
    >
      おすすめ編成
    </button>

  </div>


  <div id="normalSearch">

    <input
      id="q"
      type="search"
      placeholder="モンスター名を入力"
      autocomplete="off"
    >


    <div
      id="sortRow"
      class="sortrow"
    >

      <label for="sortSelect">
        並び順
      </label>

      <select id="sortSelect">

        <option value="number">
          図鑑番号順
        </option>

        <option value="name">
          名前順
        </option>

        <option value="rank">
          ランク順
        </option>

        <option value="family">
          種族順
        </option>

        <option value="hp">
          HP
        </option>

        <option value="mp">
          MP
        </option>

        <option value="attack">
          攻撃力
        </option>

        <option value="defence">
          守備力
        </option>

        <option value="agility">
          すばやさ
        </option>

        <option value="wisdom">
          かしこさ
        </option>

      </select>

      <select
        id="sortDirection"
        aria-label="昇順・降順"
      >
        <option value="asc">昇順</option>
        <option value="desc">降順</option>
      </select>

      <button
        id="filterToggle"
        class="filter-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="monsterFilters"
      >
        ▶ 絞り込み
      </button>

    </div>

    <div
      id="monsterFilters"
      class="monster-filters"
      hidden
    >
      <div class="filter-group">
        <div class="filter-title">ランク（複数選択可）</div>
        <div id="rankFilters" class="filter-options"></div>
      </div>

      <div class="filter-group">
        <div class="filter-title">種族（複数選択可）</div>
        <div id="familyFilters" class="filter-options"></div>
      </div>

      <button
        id="clearFilters"
        class="clearbutton"
        type="button"
      >
        絞り込み解除
      </button>
    </div>

  </div>


  <button
    id="recommendPanelToggle"
    class="recommend-panel-toggle"
    type="button"
    hidden
    aria-expanded="true"
  >
    ▲ 編成条件を収納
  </button>

  <div
    id="recommendControls"
    class="recommend-controls"
    hidden
  >
    <label>
      テーマ
      <select id="recommendTarget">
        <optgroup label="属性">
          <option value="fire">🔥 火</option>
          <option value="water">💧 水</option>
          <option value="wind">🌪️ 風</option>
          <option value="earth">🪨 地</option>
          <option value="explosion">💥 爆発</option>
          <option value="ice">❄️ 氷結</option>
          <option value="electric">⚡ 電撃</option>
          <option value="light">✨ 光</option>
          <option value="dark">🌑 闇</option>
        </optgroup>
        <optgroup label="特殊火力">
          <option value="critical">💥 会心</option>
        </optgroup>
        <optgroup label="状態異常・妨害">
          <option value="sleep">😴 眠り</option>
          <option value="confusion">🌀 混乱</option>
          <option value="paralysis">⚡ マヒ</option>
          <option value="stun">💫 休み</option>
          <option value="poison">☠️ 毒</option>
          <option value="blind">🌫️ 幻惑</option>
          <option value="seal">🔒 封じ</option>
          <option value="debuff">📉 弱体化</option>
          <option value="death">💀 即死</option>
        </optgroup>
      </select>
    </label>

    <label>
      方針
      <select id="recommendStrategy">
        <option value="stable">安定攻略</option>
        <option value="power">火力重視</option>
        <option value="control">妨害重視</option>
      </select>
    </label>

    <label>
      編成サイズ
      <select id="recommendFormation" disabled title="DQM4の編成データは確認待ちです">
        <option value="SSSS">S × 4</option>
        <option value="LSS">L × 1 ＋ S × 2</option>
        <option value="LL">L × 2</option>
      </select>
    </label>
  </div>

  <button
    id="planPanelToggle"
    class="plan-panel-toggle"
    type="button"
    hidden
    aria-expanded="true"
  >
    ▲ 操作パネルを収納
  </button>

  <div
    id="planControls"
    class="plan-controls"
    hidden
  >

    <input
      id="planTarget"
      type="search"
      list="monsterOptions"
      placeholder="作りたいモンスター名"
      autocomplete="off"
    >

    <datalist
      id="monsterOptions"
    ></datalist>

    <button
      id="buildPlan"
      class="mainbutton"
      type="button"
    >
      配合ルートを作成
    </button>

    <div class="plan-rank-control">
      <label class="plan-rank-check">
        <input
          id="planMinRankEnabled"
          type="checkbox"
        >
        <span>最低ランクを指定</span>
      </label>

      <select
        id="planMinRank"
        aria-label="配合する最低ランク"
        disabled
      >
        <option value="G">Gランク</option>
        <option value="F">Fランク</option>
        <option value="E">Eランク</option>
        <option value="D" selected>Dランク</option>
        <option value="C">Cランク</option>
        <option value="B">Bランク</option>
        <option value="A">Aランク</option>
        <option value="S">Sランク</option>
        <option value="X">Xランク</option>
      </select>
    </div>

  </div>

  <div
    id="planSubtabs"
    class="plan-subtabs"
    hidden
  >
    <button
      id="planCurrentTab"
      class="plan-subtab active"
      type="button"
    >
      作成中
    </button>

    <button
      id="planSavedTab"
      class="plan-subtab"
      type="button"
    >
      保存ルート 0/16
    </button>

    <button
      id="planMaterialsTab"
      class="plan-subtab"
      type="button"
    >
      素材合計
    </button>
  </div>

</header>


<main>
<section class="preparation-note">公開情報に基づくDQM4データです。未公開の数値・習得条件は確認待ちです。ステータス順は数値登録後に利用できます。</section>

  <div
    id="status"
    class="status"
  >
    データを読み込み中…
  </div>

  <div id="results"></div>

</main>


<footer>

  モンスター名をタップすると画像検索を開きます。<br>

  配合計画のチェック状態は
  この端末に保存されます。

</footer>


<script
  src="./app.js?v=3"
></script>

</body>

</html>
